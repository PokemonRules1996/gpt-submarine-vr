<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Жёлтый Батискаф — VR прототип</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="hud" aria-live="polite">
      <div class="title">ЖЁЛТЫЙ БАТИСКАФ <span>— ПРОТОТИП</span></div>
      <div class="meter"><span>ЭНЕРГИЯ</span><div class="bar"><div id="charge"></div></div><b id="charge-value">100%</b></div>
      <p id="message">Возьмитесь за рычаги триггером. Правая рука — ход, левая — глубина и поворот.</p>
      <p class="hint">ПК: W/A/S/D — ход · R/F — глубина · Q/E — поворот · C — зарядка</p>
    </div>
    <button id="enter-vr">Войти в VR</button>
    <div id="crosshair" aria-hidden="true">+</div>
    <script type="importmap">
      { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }}
    </script>
    <script type="module" src="./game.js"></script>
  </body>
</html>
